{% extends "base.html" %}
{% block title %}Order Confirmed — NEXORA{% endblock %}
{% block content %}

<div class="max-w-xl mx-auto px-5 py-12 md:py-16 text-center">
  <div class="card p-8 md:p-12 shadow-xl border border-white/10">
    <div class="w-16 h-16 rounded-full bg-mint-soft flex items-center justify-center mx-auto mb-6">
      <i data-lucide="check-circle-2" class="w-8 h-8" style="color:#0E7A64"></i>
    </div>
    <h1 class="font-display text-2xl font-bold text-navy">Payment Confirmed</h1>
    <p class="text-sm text-ink/70 mt-2 leading-relaxed">
      Thank you for your order. Your listing has been published and is now live across the NEXORA marketplace.
    </p>
    <div class="mt-8 pt-6 border-t border-grey-line flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{{ url_for('employer_dashboard') }}" class="btn btn-primary px-6 py-2.5">
        Go to Employer Dashboard
      </a>
      <a href="{{ url_for('jobs') }}" class="btn btn-secondary px-6 py-2.5">
        View Live Jobs
      </a>
    </div>
  </div>
</div>

{% endblock %}
